<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كُرْسِيُّ الإِمَامِ مَالِكٍ</title>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f7f5ef;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    /* === 8-POINT STAR MARK (Khatam) === */
    .mark {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    /* the star is built from two overlapping squares */
    .mark .square {
      position: absolute;
      width: 68px;
      height: 68px;
      top: 14px;
      left: 14px;
      border: 2px solid #1b4332;
    }

    .mark .square.a { transform: rotate(0deg); }
    .mark .square.b { transform: rotate(45deg); }

    /* gold center dot */
    .mark .core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      background: #d4a942;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    /* === TEXT === */
    .text {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .text .arabic {
      font-family: 'Reem Kufi', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
      color: #1b4332;
      direction: rtl;
      letter-spacing: 0.5px;
    }

    .text .arabic .gold {
      color: #d4a942;
    }

    .text .latin {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #1b4332;
      opacity: 0.4;
    }

    /* === RESPONSIVE === */
    @media (max-width: 560px) {
      .logo {
        flex-direction: column;
        gap: 24px;
        text-align: center;
      }
      .mark { width: 80px; height: 80px; }
      .mark .square { width: 56px; height: 56px; top: 12px; left: 12px; }
      .mark .core { width: 14px; height: 14px; }
      .text .arabic { font-size: 1.4rem; }
      .text .latin { font-size: 0.55rem; letter-spacing: 4px; }
      .text { align-items: center; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="mark">
      <div class="square a"></div>
      <div class="square b"></div>
      <div class="core"></div>
    </div>

    <div class="text">
      <div class="arabic">كُرْسِيُّ الإِمَامِ <span class="gold">مَالِكٍ</span></div>
      <div class="latin">Chair of Imam Malik</div>
    </div>
  </div>
</body>
</html>
