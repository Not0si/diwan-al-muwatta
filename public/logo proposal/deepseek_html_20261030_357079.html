<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كُرْسِيُّ الإِمَامِ مَالِكٍ</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f5f2eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Amiri', 'Scheherazade New', serif;
      padding: 2rem;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* === MARK === */
    .mark {
      position: relative;
      width: 176px;
      height: 176px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .square {
      position: absolute;
      width: 136px;
      height: 136px;
      background: #1b4332;
      border-radius: 28px;
      transform: rotate(45deg);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.15) inset,
        0 24px 55px -14px rgba(27, 67, 50, 0.5);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.55s ease;
    }

    .square.back {
      background: #d4a942;
      transform: rotate(45deg) translate(-10px, -10px);
      box-shadow: none;
      z-index: -1;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .square.front::after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(245, 242, 235, 0.15);
      border-radius: 21px;
    }

    /* letter — nudged to sit optically centered */
    .letter {
      position: relative;
      z-index: 2;
      font-family: 'Amiri', serif;
      font-size: 6.8rem;
      font-weight: 700;
      line-height: 1;
      color: #f5f2eb;
      transform: translateY(12px);
      user-select: none;
    }

    /* === TEXT === */
    .text {
      margin-top: 44px;
      text-align: center;
      direction: rtl;
      color: #1b4332;
    }

    .text .top {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 3px;
      opacity: 0.55;
    }

    .text .bottom {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      margin-top: 0;
      line-height: 1.15;
      transition: color 0.4s ease;
    }

    .rule {
      width: 44px;
      height: 1.5px;
      background: #d4a942;
      margin: 20px auto 12px;
    }

    .en {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.58rem;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #1b4332;
      opacity: 0.45;
      direction: ltr;
      font-weight: 500;
    }

    /* === HOVER === */
    .logo:hover .square.front {
      transform: rotate(45deg) scale(1.04);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.2) inset,
        0 30px 70px -14px rgba(27, 67, 50, 0.55);
    }
    .logo:hover .square.back {
      transform: rotate(45deg) translate(-15px, -15px) scale(1.02);
    }
    .logo:hover .bottom {
      color: #d4a942;
    }

    /* === RESPONSIVE === */
    @media (max-width: 480px) {
      .mark { width: 148px; height: 148px; }
      .square { width: 114px; height: 114px; border-radius: 23px; }
      .square.back { transform: rotate(45deg) translate(-8px, -8px); }
      .letter { font-size: 5.6rem; transform: translateY(10px); }
      .text { margin-top: 36px; }
      .text .top { font-size: 0.9rem; letter-spacing: 2px; }
      .text .bottom { font-size: 1.95rem; letter-spacing: 2px; }
      .rule { margin: 16px auto 10px; }
      .en { font-size: 0.52rem; letter-spacing: 6px; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="mark">
      <div class="square back"></div>
      <div class="square front"></div>
      <div class="letter">م</div>
    </div>

    <div class="text">
      <div class="top">كُرْسِيُّ الإِمَامِ</div>
      <div class="bottom">مَالِكٍ</div>
      <div class="rule"></div>
      <div class="en">Chair of Imam Malik</div>
    </div>
  </div>
</body>
</html>
